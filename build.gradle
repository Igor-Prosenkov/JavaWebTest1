plugins {
    id 'java'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation group: 'org.junit.jupiter', name: 'junit-jupiter-api', version: '5.10.3'
    testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter-engine', version: '5.10.3'
    testImplementation 'org.assertj:assertj-core:3.24.2'
    implementation group: 'io.qameta.allure', name: 'allure-junit5', version: '2.29.0'
    implementation group: 'com.codeborne', name: 'selenide', version: '7.5.1'
}

test {
    useJUnitPlatform()
}
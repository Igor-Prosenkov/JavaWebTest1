plugins {
    id 'java'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-jupiter-engine:5.10.0'
    testImplementation 'org.assertj:assertj-core:3.24.2'
    implementation group: 'io.cameta.allure', name: 'allure-junit5', version: '2.29.0'
    implementation group: 'com.codeborne', name: 'selenide', version: '7.5.1'
}

test {
    useJUnitPlatform()
}